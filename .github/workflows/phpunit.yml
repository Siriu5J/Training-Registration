name: PHPUnit Tests for WordPress

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mysqli, pdo_mysql
        tools: composer

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y subversion default-mysql-client

    - name: Install PHP Dependencies
      run: composer install --prefer-dist --no-progress

    - name: Setup WordPress Test Environment
      # We pass 'true' as the 6th parameter to skip DB creation since the mysql service creates it.
      run: |
        bash scripts/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest true

    - name: Run Unit Tests
      run: ./vendor/bin/phpunit --testsuite Unit

    - name: Run Integration Tests
      run: ./vendor/bin/phpunit -c phpunit-integration.xml